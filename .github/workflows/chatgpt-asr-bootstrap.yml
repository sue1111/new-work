name: chatgpt-asr-bootstrap

on:
  push:
    branches:
      - chatgpt-asr-bootstrap

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare ASR bundle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p bundle/wheels bundle/model
          python -m pip download --only-binary=:all: --dest bundle/wheels vosk
          curl -fL --retry 3 -o bundle/model/vosk-model-small-ru-0.22.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          ls -lh bundle/wheels bundle/model
      - name: Upload ASR bundle
        uses: actions/upload-artifact@v4
        with:
          name: russian-asr-bundle
          path: bundle/
          retention-days: 1
